# The local stack: Postgres, api, worker, backup, web and supervisor on one
# network, every service with a healthcheck, plus a one-shot `migrate` that
# applies the schema and the two service roles before the always-on processes
# start.
# `pnpm stack:up` builds these images and blocks until each healthcheck passes;
# `pnpm stack:down` removes the containers, the network and the Postgres volume.
#
# Nothing here needs a key, a hosted provider or network egress at run time: no
# provider endpoint is configured, and the only images pulled are the
# digest-pinned Node and Postgres images registered in dependencies.json. The
# provider emulators replace vendor calls as their slices land.
#
# Host ports bind to loopback and are overridable so the stack can run beside
# another Postgres or dev server: PORKBOT_POSTGRES_PORT, PORKBOT_API_PORT,
# PORKBOT_WEB_PORT. The role passwords are the local-stack placeholders unless
# PORKBOT_API_DB_PASSWORD / PORKBOT_WORKER_DB_PASSWORD override them; a real
# deployment supplies its own, and they never appear in a committed file.

name: porkbot

x-app: &app
  restart: unless-stopped
  healthcheck:
    # Readiness asks the process whether its dependencies are available; a
    # live process that cannot reach them stays up but is not healthy.
    test:
      - CMD
      - node
      - -e
      - >-
        fetch("http://127.0.0.1:" + process.env.PORT + "/readyz").then((response) =>
        process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
    interval: 2s
    timeout: 3s
    retries: 30
    start_period: 5s

services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PORKBOT_POSTGRES_USER:-porkbot}
      POSTGRES_PASSWORD: ${PORKBOT_POSTGRES_PASSWORD:-porkbot-local}
      POSTGRES_DB: ${PORKBOT_POSTGRES_DB:-porkbot}
    ports:
      # Loopback only: the stack is a local surface, not a network service.
      - "127.0.0.1:${PORKBOT_POSTGRES_PORT:-5432}:5432"
    volumes:
      # Postgres 18 keeps the cluster under /var/lib/postgresql, and the image
      # declares that path as its volume.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30
      start_period: 5s

  migrate:
    # A one-shot, not a service: it applies the journal to the stack's database
    # and exits, and the api and the worker wait for exit zero. Its admin
    # connection is the Postgres service's own user; the two role passwords it
    # sets are what the api and the worker below authenticate with.
    build:
      context: .
      target: migrate
    image: porkbot/migrate:local
    restart: "no"
    environment:
      DATABASE_URL: postgres://${PORKBOT_POSTGRES_USER:-porkbot}:${PORKBOT_POSTGRES_PASSWORD:-porkbot-local}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      PORKBOT_API_DB_PASSWORD: ${PORKBOT_API_DB_PASSWORD:-porkbot-api-local}
      PORKBOT_WORKER_DB_PASSWORD: ${PORKBOT_WORKER_DB_PASSWORD:-porkbot-worker-local}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *app
    build:
      context: .
      target: api
    image: porkbot/api:local
    environment:
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The API's own role, over the compose network: read and write the
      # application schema, and nothing in the worker's queue.
      DATABASE_URL: postgres://porkbot_api:${PORKBOT_API_DB_PASSWORD:-porkbot-api-local}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      # Bytes that must outlive the container: bot avatars through the storage
      # seam live here, on a named volume the backup tooling can read rather
      # than the container's ephemeral layer.
      PORKBOT_STORAGE_DIR: /var/lib/porkbot/storage
      # Computers are reached through the supervisor's authenticated surface;
      # this process holds no Docker socket and no provider credential.
      PORKBOT_SUPERVISOR_URL: http://supervisor:3003
      PORKBOT_SUPERVISOR_TOKEN: ${PORKBOT_SUPERVISOR_TOKEN:-porkbot-supervisor-local}
    ports:
      - "127.0.0.1:${PORKBOT_API_PORT:-3001}:3001"
    volumes:
      - storage-data:/var/lib/porkbot/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  worker:
    <<: *app
    build:
      context: .
      target: worker
    image: porkbot/worker:local
    environment:
      PORT: "3002"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The worker's own role: read the run state it executes, own the job
      # queue's schema, and no domain write.
      DATABASE_URL: postgres://porkbot_worker:${PORKBOT_WORKER_DB_PASSWORD:-porkbot-worker-local}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      # Where run-liveness notification links point. A local stack serves the
      # web on loopback; a deployment names its public origin.
      PORKBOT_WEB_ORIGIN: ${PORKBOT_WEB_ORIGIN:-http://localhost:3000}
      # The optional webhook destination. Unset, notifications go to the
      # offline emulator and the product notifies with nothing configured; set,
      # the key is read from PORKBOT_NOTIFICATION_WEBHOOK_KEY through the
      # generic credential store.
      PORKBOT_NOTIFICATION_WEBHOOK_URL: ${PORKBOT_NOTIFICATION_WEBHOOK_URL:-}
      PORKBOT_NOTIFICATION_WEBHOOK_KEY: ${PORKBOT_NOTIFICATION_WEBHOOK_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  backup:
    <<: *app
    build:
      context: .
      target: backup
    image: porkbot/backup:local
    environment:
      PORT: "3004"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The database owner's connection, not a service role: pg_dump reads the
      # whole schema, and the drill creates and drops a scratch database. No
      # other process in this stack holds this credential.
      DATABASE_URL: postgres://${PORKBOT_POSTGRES_USER:-porkbot}:${PORKBOT_POSTGRES_PASSWORD:-porkbot-local}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      # The primary storage the homes are read from, read-only: the snapshot
      # archives under computer-snapshots/ are every computer's durable home.
      PORKBOT_STORAGE_DIR: /var/lib/porkbot/storage
      # The encrypted destination and the sealed key envelope, on separate
      # volumes: a backup target and the key that opens it are never the same
      # place. The keyring and passphrase are local-stack placeholders exactly
      # like the database passwords.
      PORKBOT_BACKUP_DIR: /var/lib/porkbot/backups
      PORKBOT_BACKUP_ENVELOPE_DIR: /var/lib/porkbot/backup-envelope
      PORKBOT_BACKUP_KEYS: ${PORKBOT_BACKUP_KEYS:-local:cG9ya2JvdC1iYWNrdXAtbG9jYWwtcGxhY2Vob2xkZXI=}
      PORKBOT_BACKUP_ACTIVE_KEY: ${PORKBOT_BACKUP_ACTIVE_KEY:-local}
      PORKBOT_BACKUP_ENVELOPE_PASSPHRASE: ${PORKBOT_BACKUP_ENVELOPE_PASSPHRASE:-porkbot-backup-envelope-local}
    volumes:
      - storage-data:/var/lib/porkbot/storage:ro
      - backup-data:/var/lib/porkbot/backups
      - backup-envelope:/var/lib/porkbot/backup-envelope
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  web:
    <<: *app
    build:
      context: .
      target: web
    image: porkbot/web:local
    environment:
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "127.0.0.1:${PORKBOT_WEB_PORT:-3000}:3000"

  supervisor:
    <<: *app
    build:
      context: .
      target: supervisor
    image: porkbot/supervisor:local
    environment:
      PORT: "3003"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The process credential the API and the worker present to the internal
      # computer surface. Both sides read it from the environment, and it is a
      # placeholder here exactly like the local database passwords.
      PORKBOT_SUPERVISOR_TOKEN: ${PORKBOT_SUPERVISOR_TOKEN:-porkbot-supervisor-local}
      # The key screen capabilities are signed with. Unset refuses screen
      # access entirely; v1.1's screen watch is the surface that will mint one.
      PORKBOT_SCREEN_TOKEN_SECRET: ${PORKBOT_SCREEN_TOKEN_SECRET:-porkbot-screen-local}
      # Which computer a bot gets, through generic computer settings: the
      # offline emulator by default, Docker when the operator names an image to
      # boot, or a cloud provider when the operator names an endpoint and key.
      # A bot may select its own configured kind through its settings; a
      # selection whose kind this deployment did not configure is refused
      # fail-closed, and a default without its settings fails at supervisor
      # boot rather than at a bot's first run.
      PORKBOT_COMPUTER_PROVIDER: ${PORKBOT_COMPUTER_PROVIDER:-offline}
      PORKBOT_COMPUTER_IMAGE: ${PORKBOT_COMPUTER_IMAGE:-}
      PORKBOT_COMPUTER_SOCKET: ${PORKBOT_COMPUTER_SOCKET:-/var/run/docker.sock}
      # The cloud control plane this deployment may reach. The endpoint, key
      # and image together make the cloud provider selectable per bot; empty
      # values keep the stack offline.
      PORKBOT_COMPUTER_ENDPOINT: ${PORKBOT_COMPUTER_ENDPOINT:-}
      PORKBOT_COMPUTER_TOKEN: ${PORKBOT_COMPUTER_TOKEN:-}
      PORKBOT_COMPUTER_TOOLBOX_URL: ${PORKBOT_COMPUTER_TOOLBOX_URL:-}
      # The credential proxy (slice 7.8): three settings that only make sense
      # together, and all unset by default — an offline stack needs no proxy.
      # Configured, every Docker computer gets a sidecar on its isolated
      # network; run credentials live on the sidecar's own layer and the
      # sandbox carries only a short-lived capability. PORKBOT_PROXY_TOKEN_SECRET is
      # the key both the worker and the sidecars verify capabilities with, and
      # the egress network is the sidecar's second leg to an upstream.
      PORKBOT_COMPUTER_PROXY_IMAGE: ${PORKBOT_COMPUTER_PROXY_IMAGE:-}
      PORKBOT_PROXY_TOKEN_SECRET: ${PORKBOT_PROXY_TOKEN_SECRET:-}
      PORKBOT_COMPUTER_EGRESS_NETWORK: ${PORKBOT_COMPUTER_EGRESS_NETWORK:-}
      # Snapshot storage (slice 7.5): the same seam the API writes avatars
      # through, so an operator's chosen storage root holds both. The archive
      # directory stages a home while it is written or verified.
      PORKBOT_STORAGE_DIR: /var/lib/porkbot/storage
      PORKBOT_COMPUTER_ARCHIVE_DIR: /var/lib/porkbot/computer-archives
      # A machine whose last command is older than this is parked; the home
      # volume survives. Zero disables the idle sweep.
      PORKBOT_COMPUTER_IDLE_MS: ${PORKBOT_COMPUTER_IDLE_MS:-900000}
      # One bot's share of the documented host floor (README, "A bot's
      # computer"): 4 vCPU / 8 GB plus ~2 GB per bot and 50 GB+ of disk. Raise
      # these only after raising the host.
      PORKBOT_COMPUTER_CPUS: ${PORKBOT_COMPUTER_CPUS:-1}
      PORKBOT_COMPUTER_MEMORY_MB: ${PORKBOT_COMPUTER_MEMORY_MB:-2048}
      PORKBOT_COMPUTER_DISK_MB: ${PORKBOT_COMPUTER_DISK_MB:-10240}
    volumes:
      # The only place the Docker socket is mounted in the stack. The
      # supervisor owns computer lifecycle; every other process reaches
      # computers through its authenticated surface, which is what keeps a
      # compromised API or worker out of the daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      # Snapshot archives live under the same storage root the API uses, on a
      # shared named volume, and are staged on a second one so an agent home in
      # the clear never lands in the container's writable layer.
      - storage-data:/var/lib/porkbot/storage
      - computer-archives:/var/lib/porkbot/computer-archives

volumes:
  postgres-data:
  storage-data:
  computer-archives:
  backup-data:
  backup-envelope:
