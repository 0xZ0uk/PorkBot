name: CI

# One job per tier, so a red tier is a red check with a name rather than a step
# index buried in a log. The check names below are the required status checks on
# `main`; scripts/setup-branch-protection.sh reads this file and applies them.
#
#   format       prettier --check
#   lint         eslint, including the module-boundary rules
#   typecheck    tsc --noEmit everywhere
#   build        tsc emit, the artifact every later tier and every deploy uses
#   quarantine   the quarantine ledger is valid and nothing in it is stale
#   dependencies the pin register, manifests, lockfile and image digests agree, and the
#                lockfile delta is written to the job summary on a pull request
#   env          every .env.schema loads under the committed APP_ENV=ci fixtures and every
#                audit is in sync with the code that reads the variables
#   posture      the license, contributing, security and template files hold, and the full
#                history carries no provider-shaped secret or personal data
#   docs         doc links resolve, and the environment reference matches the schemas
#                and the deployment template
#   unit         unit tests with coverage; thresholds gate @porkbot/core and @porkbot/db
#   integration  integration tests against the Postgres 18 the local stack boots
#   e2e          real-browser release flows against the built output and offline emulators;
#                the only tier that retries
#   desktop      the desktop pipeline: package, sign, and smoke the packaged app under Xvfb
#   gate         green only when every tier above is green
#
# The retry policy, the timeouts and the quarantine ledger are enforced by the
# tier presets in packages/testkit, which every package's vitest config calls; the
# quarantine tier is the named check for the ledger itself, so an expired entry
# fails with its own name instead of inside a test log.
#
# The integration tier gets its Postgres from the local stack (slice 1.8): the
# job runs `pnpm stack:up`, the same command developers run, so CI proves the
# images build, every healthcheck passes and the command waits for them. The
# testkit harness then attaches to the stack's Postgres instead of booting its
# own container, the specs clone a suite database from the migrated template,
# and the job removes the stack with `if: always()` so a red tier does not leave
# a container behind. The job has no `services:` block on purpose — "works in CI
# with no external service" is a criterion, so CI is where that is proven.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  TURBO_TELEMETRY_DISABLED: "1"
  # Pin the cache directory so `.github/actions/setup` can persist a known path.
  TURBO_CACHE_DIR: .turbo/cache
  # Optional turbo remote cache. Set the TURBO_TOKEN secret and the TURBO_TEAM
  # repository variable, then uncomment the two lines below; no other change is
  # needed. Until then turbo uses only the on-disk cache, which this workflow
  # persists between runs.
  # TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
  # TURBO_TEAM: ${{ vars.TURBO_TEAM }}

jobs:
  format:
    name: format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm lint

  # The ledger is checked before any test runs and before anything is installed:
  # the CLI reads nothing but the ledger and the tests it names, so this tier is
  # seconds long, and a stale entry fails here with its own name.
  quarantine:
    name: quarantine
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check the quarantine ledger
        timeout-minutes: 2
        run: node packages/testkit/src/quarantine/cli.ts check

  # Dependency provenance. Like quarantine, this reads files and no toolchain,
  # so a moved pin or an unpinned image is a red check by name rather than a
  # line in someone's install log. The diff step is the reviewer's view of the
  # lockfile: it never fails the tier, it makes the change readable.
  dependencies:
    name: dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # The lockfile diff compares against the base branch revision.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check pins, provenance and image digests
        timeout-minutes: 2
        run: node packages/testkit/src/dependencies/cli.ts check
      - name: Surface lockfile changes
        if: github.event_name == 'pull_request'
        timeout-minutes: 5
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: node packages/testkit/src/dependencies/cli.ts diff --base "$BASE_REF"

  # Environment schemas. `varlock load` proves every `.env.schema` parses, its
  # imports resolve and its required items have values under the committed
  # `APP_ENV=ci` fixtures; `varlock audit` proves code and schema agree in both
  # directions. This tier fails by name when a variable the code reads is not
  # declared, or a declared variable no code reads is left behind.
  env:
    name: env
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Check environment schemas
        timeout-minutes: 5
        run: pnpm env:check

  # Public-launch posture. Like the dependency policy this reads files and git
  # objects and no toolchain, but the audit covers every published commit and
  # blob, so it is the one job that fetches the full history. Findings are
  # annotations on this step and never quote a matched value: the output is
  # public.
  posture:
    name: posture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Audit the posture files and the published history
        timeout-minutes: 5
        run: node packages/testkit/src/posture/cli.ts check

  # Documentation staleness. Like quarantine and dependencies this tier reads
  # files and no toolchain, so a rotted link or an environment name nothing
  # declares is a red check by name instead of a surprise for a reader. The
  # same check runs in the unit tier through packages/testkit/test/docs.test.ts.
  docs:
    name: docs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
      - name: Check links and the environment reference
        timeout-minutes: 2
        run: node packages/testkit/src/docs/cli.ts check

  # The build job populates the turbo cache that typecheck, unit, e2e and
  # integration then restore, which is why they wait for it rather than racing it.
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm build

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: pnpm typecheck

  unit:
    name: unit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Unit tests with coverage
        # Coverage runs in the tier that gates merges. Thresholds live in the
        # package's own vitest.config.ts and gate @porkbot/core and @porkbot/db;
        # every other package reports without gating.
        #
        # The step has its own budget on top of the job's: every test has a
        # timeout, and this is the backstop for the runner itself.
        timeout-minutes: 20
        run: pnpm test:coverage
      - name: Coverage summary
        if: always()
        run: node scripts/coverage-summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Upload coverage reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            apps/*/coverage/lcov.info
            apps/*/coverage/coverage-summary.json
            packages/*/coverage/lcov.info
            packages/*/coverage/coverage-summary.json
          if-no-files-found: warn

  integration:
    name: integration
    runs-on: ubuntu-latest
    timeout-minutes: 50
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Expose the Docker socket group to the supervisor
        run: echo "PORKBOT_DOCKER_SOCKET_GID=$(stat -c '%g' /var/run/docker.sock)" >> "$GITHUB_ENV"
      # The same command a developer runs. It builds the app images, starts
      # Postgres, api, worker, proxy and supervisor, and blocks on `--wait` until
      # every healthcheck passes, so a stack that starts here is the one
      # `docs/architecture/operations.md` documents. Every image it builds from
      # or runs is pinned by digest in dependencies.json, which the
      # `dependencies` tier checks.
      - name: Start the local stack
        timeout-minutes: 25
        run: pnpm stack:up
      # Every service image is built by now (stack:up builds the backup image
      # for its startup run too), so measure each one against the ceiling in
      # image-budgets.json and write the table to the job summary: the sizes
      # land on the pull request, and an image past its budget is a red tier
      # rather than a surprise on a host's disk.
      - name: Check image sizes against their budgets
        timeout-minutes: 5
        run: node packages/testkit/src/image-sizes/cli.ts check
      # The harness attaches to the stack's Postgres (the compose defaults are
      # `porkbot`/`porkbot-local` on 127.0.0.1:5432) and migrates the template,
      # so the specs clone from the template rather than each booting a
      # container. The tests assert the server major rather than trusting a tag.
      - name: Attach the testkit harness to the stack's Postgres
        timeout-minutes: 5
        env:
          TESTKIT_DATABASE_URL: postgres://porkbot:porkbot-local@127.0.0.1:5432/porkbot
        run: |
          pnpm testkit:start
          pnpm testkit:migrate
      - name: Integration tests against the stack
        timeout-minutes: 20
        env:
          # The specs clone the run-level template instead of each booting a
          # container, which is what the measured per-suite cost documents.
          TESTKIT_HARNESS_STATE: .testkit/harness.json
        run: pnpm test:integration
      # Exercise the production deployment commands against a second Compose
      # project while the local stack is still running. The deployment's
      # ingress is the reverse proxy on loopback :80, so the origin names no
      # port; the API port stays apart from the local stack's.
      - name: Exercise upgrade and rollback against deployment Compose
        timeout-minutes: 15
        env:
          PORKBOT_DEPLOY_PROJECT: porkbot-deployment-ci
          PORKBOT_API_PORT: "3101"
          PORKBOT_DEPLOY_WAIT_SECONDS: "180"
        run: |
          deploy_env="$RUNNER_TEMP/porkbot-deployment.env"
          base_tag="base-${GITHUB_SHA}"
          upgrade_tag="upgrade-${GITHUB_SHA}"

          pnpm deploy:setup \
            --origin http://127.0.0.1 \
            --tag "$base_tag" \
            --env-path "$deploy_env"

          for service in api worker backup proxy supervisor migrate; do
            docker image tag "porkbot/${service}:local" "porkbot/${service}:${base_tag}"
            docker image tag "porkbot/${service}:local" "porkbot/${service}:${upgrade_tag}"
          done

          compose=(docker compose
            --project-name "$PORKBOT_DEPLOY_PROJECT"
            --file deploy/compose.yaml
            --env-file "$deploy_env")

          "${compose[@]}" up --detach --no-build --wait --wait-timeout "$PORKBOT_DEPLOY_WAIT_SECONDS"
          schema_before="$("${compose[@]}" exec -T postgres psql -U porkbot -d porkbot -Atc 'select count(*) from drizzle.__drizzle_migrations')"

          pnpm deploy:upgrade \
            --env-path "$deploy_env" \
            --tag "$upgrade_tag" \
            --wait-timeout "$PORKBOT_DEPLOY_WAIT_SECONDS"

          schema_after_upgrade="$("${compose[@]}" exec -T postgres psql -U porkbot -d porkbot -Atc 'select count(*) from drizzle.__drizzle_migrations')"
          test "$schema_after_upgrade" -ge "$schema_before"

          pnpm deploy:rollback \
            --env-path "$deploy_env" \
            --wait-timeout "$PORKBOT_DEPLOY_WAIT_SECONDS"

          schema_after_rollback="$("${compose[@]}" exec -T postgres psql -U porkbot -d porkbot -Atc 'select count(*) from drizzle.__drizzle_migrations')"
          test "$schema_after_rollback" = "$schema_after_upgrade"

          # The measurement workload needs both provider implementations. The
          # deployment still defaults new bots to the offline emulator; this
          # pinned Node image simply makes Docker selectable for the harness's
          # explicit provider references without introducing a vendor image.
          machine_image="$(node -p 'require("./dependencies.json").images.find((entry) => entry.name === "node").reference')"
          pnpm deploy:setup --env-path "$deploy_env" --computer-image "$machine_image"
          pnpm deploy:check --env-path "$deploy_env"
          pnpm deploy:measure \
            --env-path "$deploy_env" \
            --bots 1 \
            --idle-seconds 1 \
            --sample-interval-seconds 1 \
            --table-path "$RUNNER_TEMP/porkbot-measured-floor.md" \
            --raw-path artifacts/deployment-measurement/ci.json
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const report = JSON.parse(readFileSync("artifacts/deployment-measurement/ci.json", "utf8"));
            if (report.schemaVersion !== 1 || report.botCount !== 1 || !Array.isArray(report.samples) || report.samples.length === 0) {
              throw new Error("deployment measurement report shape is incomplete");
            }
            const required = ["cold-boot", "migration", "idle-hour", "bots-offline-working", "bots-docker-working", "backup-restore-drill"];
            for (const phase of required) {
              if (!report.workload.phases.some((entry) => entry.id === phase && entry.completed === true)) {
                throw new Error(`deployment measurement phase is incomplete: ${phase}`);
              }
            }
          '
      # Cleanup is best effort and cannot hide a failed deployment check.
      - name: Stop deployment smoke stack
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        env:
          PORKBOT_DEPLOY_PROJECT: porkbot-deployment-ci
        run: pnpm deploy:down
      - name: Upload deployment measurement samples
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-measurement
          path: artifacts/deployment-measurement
          if-no-files-found: warn
      # `always()` and `continue-on-error` together: cleanup runs even when the
      # tier is red, and a cleanup failure can never change the tier's result.
      - name: Destroy the testkit harness
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm testkit:destroy
      - name: Stop the stack
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm stack:down

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 35
    needs: [build]
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Detect UI changes
        id: ui
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          # git's own pathspec diff, not a pipe through a tool the runner may
          # not have: ripgrep is not on the image, so the old command read
          # every UI change as none and the screenshot gate never fired.
          if git diff --quiet "$BASE_SHA" "$HEAD_SHA" -- apps/web packages/ui packages/tokens; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # The browser fixture clones one isolated Postgres suite from this
      # harness. Mail, model and computer calls stay on their in-process
      # emulators; the only network the browser can reach is loopback.
      - name: Start the browser-test Postgres harness
        timeout-minutes: 5
        run: |
          pnpm testkit:start
          pnpm testkit:migrate
      # This tier runs the existing whole-process specs and the Playwright
      # release flow. It is the only tier that retries (twice), and Playwright
      # retains a trace and screenshot when a browser assertion fails.
      - name: End-to-end tests
        id: e2e
        timeout-minutes: 25
        env:
          TESTKIT_HARNESS_STATE: .testkit/harness.json
        run: pnpm test:e2e
      - name: Require the UI screenshot
        if: always() && steps.ui.outputs.changed == 'true'
        run: test -s apps/api/test-results/ui/porkbot-browser.png
      - name: Upload Playwright artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-${{ github.run_id }}
          path: |
            apps/api/test-results/playwright/**
            apps/api/test-results/playwright-report/**
            apps/api/test-results/ui/**
          if-no-files-found: warn
          retention-days: 14
      - name: Publish the UI screenshot comment
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          steps.ui.outputs.changed == 'true' &&
          github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        uses: actions/github-script@v7
        env:
          E2E_RESULT: ${{ steps.e2e.outcome }}
          ARTIFACTS_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}/artifacts
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const marker = "<!-- porkbot-playwright-screenshots -->";
            const body = [
              marker,
              `The browser E2E tier finished with **${process.env.E2E_RESULT}** for this UI change.`,
              `[Download the Playwright screenshot, trace and report artifacts](${process.env.ARTIFACTS_URL}).`,
            ].join("\n\n");
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
      - name: Destroy the browser-test harness
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: pnpm testkit:destroy

  # The desktop pipeline, on one Linux runner: package the app, sign an
  # ephemeral manifest to prove the signing and verification path, start a real
  # API process on loopback, and walk the packaged app's first-run flow under a
  # virtual display until the sign-in screen renders. The release workflow runs
  # the same `release` CLI with the deployment's key and the full platform
  # list; this tier is where a broken bundle or a proxy regression fails first.
  desktop:
    name: desktop
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [build]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      # The runner image already carries Chrome, which means Electron's
      # runtime libraries (NSS, GTK, GBM, ALSA and friends) are installed; the
      # virtual display the packaged app needs is the one package named here.
      - name: Install the virtual display
        timeout-minutes: 5
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends xvfb
      # The packaging CLI reads built output (`dist/`, `apps/web/dist/client`),
      # and a fresh job has only the restored turbo cache; running the same
      # `pnpm build` every other tier depends on restores it, so this is the
      # build job's output without a second artifact path.
      - name: Build the workspace
        timeout-minutes: 20
        run: pnpm build
      - name: Package the desktop for linux-x64
        timeout-minutes: 15
        run: >-
          node packages/testkit/src/release/cli.ts package
          --targets linux-x64 --out .release
      # No release key is configured on a pull request, so the tier proves the
      # signing path with a throwaway key: the artifact digest is signed, and
      # verification against the public half is the same check a release runs.
      - name: Sign and verify a CI manifest with an ephemeral key
        timeout-minutes: 5
        run: |
          openssl genpkey -algorithm ed25519 -out "$RUNNER_TEMP/release-key.pem"
          openssl pkey -in "$RUNNER_TEMP/release-key.pem" -pubout -out "$RUNNER_TEMP/release-key.pub"
          version="$(node -p "require('./apps/desktop/package.json').version")"
          PORKBOT_DESKTOP_UPDATE_PRIVATE_KEY="$(cat "$RUNNER_TEMP/release-key.pem")" \
            node packages/testkit/src/release/cli.ts sign \
              --tag "desktop-v${version}" --repo "$GITHUB_REPOSITORY"
          node packages/testkit/src/release/cli.ts verify \
            --public-key-file "$RUNNER_TEMP/release-key.pub"
      # The local server the packaged app must reach. It is the real API
      # process from source with a placeholder database: the smoke only asks
      # the pre-auth paths, which is why it needs no Postgres, and the
      # placeholder is never dialled.
      - name: Start a local API process
        timeout-minutes: 5
        run: |
          setsid nohup env \
            PORT=3199 LOG_LEVEL=info \
            DATABASE_URL="postgres://porkbot:desktop-smoke-placeholder@127.0.0.1:5432/porkbot" \
            PORKBOT_STORAGE_DIR="$RUNNER_TEMP/porkbot-desktop-storage" \
            node apps/api/src/main.ts > "$RUNNER_TEMP/api.log" 2>&1 < /dev/null &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:3199/healthz; then
              exit 0
            fi
            sleep 1
          done
          cat "$RUNNER_TEMP/api.log"
          exit 1
      - name: Smoke the packaged app under a virtual display
        timeout-minutes: 5
        run: >-
          xvfb-run --auto-servernum
          node packages/testkit/src/release/cli.ts smoke
          --app ".release/PorkBot-linux-x64/PorkBot"
          --server-url http://127.0.0.1:3199
      - name: Show the local API log
        if: failure()
        run: cat "$RUNNER_TEMP/api.log" 2>/dev/null || echo "(no API log)"
      - name: Upload the desktop artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop
          path: |
            .release/*.tar.gz
            .release/*.json
            .release/checksums.txt
          if-no-files-found: warn

  gate:
    name: gate
    # `always()` matters: if this job were skipped when a tier failed, the
    # required check would never report and the pull request would hang instead
    # of failing.
    if: always()
    needs:
      [
        format,
        lint,
        typecheck,
        build,
        quarantine,
        dependencies,
        env,
        posture,
        docs,
        unit,
        integration,
        e2e,
        desktop,
      ]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Summarize the tiers
        run: |
          {
            echo "| tier | result |"
            echo "| --- | --- |"
            echo "| format | ${{ needs.format.result }} |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| typecheck | ${{ needs.typecheck.result }} |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| quarantine | ${{ needs.quarantine.result }} |"
            echo "| dependencies | ${{ needs.dependencies.result }} |"
            echo "| env | ${{ needs.env.result }} |"
            echo "| posture | ${{ needs.posture.result }} |"
            echo "| docs | ${{ needs.docs.result }} |"
            echo "| unit | ${{ needs.unit.result }} |"
            echo "| integration | ${{ needs.integration.result }} |"
            echo "| e2e | ${{ needs.e2e.result }} |"
            echo "| desktop | ${{ needs.desktop.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Fail unless every tier passed
        # `skipped` counts as a failure: typecheck, unit and e2e are skipped when
        # build is red, and a tier that did not run has not proved anything.
        if: >-
          contains(needs.*.result, 'failure') ||
          contains(needs.*.result, 'cancelled') ||
          contains(needs.*.result, 'skipped')
        run: |
          echo "::error::At least one required tier did not pass. Merging is blocked."
          exit 1
