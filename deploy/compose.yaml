# The single-host deployment (slice 12.1, PRD stories 1 and 2, decision 32).
#
# This is the production shape of the local stack in the repository-root
# compose.yaml: the same six always-on processes plus the one-shot migrate,
# with production's teeth instead of a developer's defaults.
#
#   - No local placeholder survives. Every secret and every operator choice is
#     read through `${NAME:?}`; `docker compose` itself refuses a stack whose
#     environment is incomplete, whether it was started by `pnpm deploy:up` or
#     by hand. The one file that supplies them is deploy/.env, rendered from
#     deploy/porkbot.env.example by `pnpm deploy:setup` (or by the first
#     `pnpm deploy:up`). No key in it is invented by hand.
#   - App images are built from the root Dockerfile and tagged with
#     PORKBOT_IMAGE_TAG (the release's git SHA). Nothing is tagged `:latest`.
#     The only pulled image is Postgres, pinned by the digest registered in
#     dependencies.json.
#   - Every service declares CPU and memory ceilings (deploy.resources.limits),
#     and `docs/architecture/operations.md` (Single-host deployment) does the
#     arithmetic against the host floor: 4 vCPU / 8 GB plus ~2 GB and 50 GB+ of
#     disk per bot. Raise the ceilings here only after raising the host.
#   - Container logs are rotated, so a long-lived host does not fill its disk
#     with one chatty process.
#   - The proxy terminates HTTPS for the one public origin (slice 12.2) and is
#     the only service that publishes a public port: the SPA, the API and the
#     streaming subscriptions all enter through it. Its config is
#     deploy/Caddyfile, and its healthcheck answers only when that config
#     loaded and the API route in it works.
#   - The web and API ports are published on loopback only, for an operator's
#     own inspection; PORKBOT_BIND_ADDRESS governs the proxy's public ports.
#
# `pnpm deploy:up` renders the env file when it is missing, validates it, runs
# `docker compose up --build --wait` with this file and reports readiness per
# service; `pnpm deploy:upgrade` preflights a pulled release in disposable
# containers, runs its migration only after that preflight is healthy, and then
# switches the application services; `pnpm deploy:rollback` redeploys the
# recorded prior image without reversing migrations. `pnpm deploy:status`,
# `deploy:logs` and `deploy:down` wrap the matching compose commands.
# `pnpm deploy:check` validates the env file without touching Docker.

name: porkbot

# Every always-on process: restarts with the host, reports liveness and
# dependency readiness through its own probes, carries a ceiling and rotates
# its logs. Readiness asks the process itself, so "healthy" means its required
# dependencies are available rather than merely that a process exists.
x-app: &app
  restart: unless-stopped
  stop_grace_period: 30s
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
  healthcheck:
    test:
      - CMD
      - node
      - -e
      - >-
        fetch("http://127.0.0.1:" + process.env.PORT + "/readyz").then((response) =>
        process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))
    interval: 5s
    timeout: 5s
    retries: 12
    start_period: 20s

services:
  postgres:
    image: postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280
    restart: unless-stopped
    stop_grace_period: 60s
    environment:
      POSTGRES_USER: ${PORKBOT_POSTGRES_USER:-porkbot}
      POSTGRES_PASSWORD: ${PORKBOT_POSTGRES_PASSWORD:?run `pnpm deploy:setup` (or `pnpm deploy:up`) to render deploy/.env}
      POSTGRES_DB: ${PORKBOT_POSTGRES_DB:-porkbot}
    volumes:
      # Postgres 18 keeps the cluster under /var/lib/postgresql, and the image
      # declares that path as its volume.
      - postgres-data:/var/lib/postgresql
    # Not published: the api, worker and migrate reach the database over the
    # compose network. An operator who needs psql runs
    # `pnpm deploy:exec -- postgres psql -U "$PORKBOT_POSTGRES_USER"` instead of
    # exposing the port.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2g

  migrate:
    # The one-shot: it applies the committed journal, creates the two service
    # roles and sets their passwords, then exits; the api and the worker wait
    # on service_completed_successfully, so an always-on process never starts
    # against an unmigrated database.
    build:
      context: ..
      target: migrate
    image: porkbot/migrate:${PORKBOT_IMAGE_TAG:?run `pnpm deploy:setup` (or `pnpm deploy:up`) to render deploy/.env}
    restart: "no"
    environment:
      DATABASE_URL: postgres://${PORKBOT_POSTGRES_USER:-porkbot}:${PORKBOT_POSTGRES_PASSWORD:?}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      PORKBOT_API_DB_PASSWORD: ${PORKBOT_API_DB_PASSWORD:?}
      PORKBOT_WORKER_DB_PASSWORD: ${PORKBOT_WORKER_DB_PASSWORD:?}
    depends_on:
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          # The one-shot applies SQL and exits; 0.1 vCPU is plenty, and the
          # rest of the CPU ceiling goes to the proxy below.
          cpus: "0.1"
          memory: 512m

  api:
    <<: *app
    build:
      context: ..
      target: api
    image: porkbot/api:${PORKBOT_IMAGE_TAG:?run `pnpm deploy:setup` (or `pnpm deploy:up`) to render deploy/.env}
    environment:
      PORT: "3001"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The API's own role, over the compose network: read and write the
      # application schema, and nothing in the worker's queue.
      DATABASE_URL: postgres://porkbot_api:${PORKBOT_API_DB_PASSWORD:?}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      PORKBOT_STORAGE_DIR: /var/lib/porkbot/storage
      # Computers are reached through the supervisor's authenticated surface;
      # this process holds no Docker socket and no provider credential.
      PORKBOT_SUPERVISOR_URL: http://supervisor:3003
      PORKBOT_SUPERVISOR_TOKEN: ${PORKBOT_SUPERVISOR_TOKEN:?}
      # The operator auth pair is required here rather than optional: a
      # deployment whose API answers 401 to everything is not a deployment.
      PORKBOT_AUTH_SECRET: ${PORKBOT_AUTH_SECRET:?}
      PORKBOT_AUTH_ORIGIN: ${PORKBOT_AUTH_ORIGIN:?}
      # The consent callback the MCP OAuth flow returns to; empty keeps the
      # loopback fallback the app warns about.
      PORKBOT_MCP_CALLBACK_URL: ${PORKBOT_MCP_CALLBACK_URL:-}
      # The keyring that encrypts stored credentials at rest. Both are
      # required: the store is what keeps provider keys out of list responses.
      PORKBOT_CREDENTIAL_KEYS: ${PORKBOT_CREDENTIAL_KEYS:?}
      PORKBOT_CREDENTIAL_ACTIVE_KEY: ${PORKBOT_CREDENTIAL_ACTIVE_KEY:?}
      # Transactional mail is optional and all-or-nothing (the app enforces
      # it): unset, sign-in and sign-out still work and reset mail is refused
      # as a typed configuration error.
      PORKBOT_MAIL_ENDPOINT: ${PORKBOT_MAIL_ENDPOINT:-}
      PORKBOT_MAIL_FROM: ${PORKBOT_MAIL_FROM:-}
      PORKBOT_MAIL_KEY: ${PORKBOT_MAIL_KEY:-}
    ports:
      # Loopback only. The reverse proxy is the way in from outside; this
      # mapping stays for an operator's own curl against the process.
      - "127.0.0.1:${PORKBOT_API_PORT:-3001}:3001"
    volumes:
      - storage-data:/var/lib/porkbot/storage
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.7"
          memory: 1g

  worker:
    <<: *app
    build:
      context: ..
      target: worker
    image: porkbot/worker:${PORKBOT_IMAGE_TAG:?run `pnpm deploy:setup` (or `pnpm deploy:up`) to render deploy/.env}
    environment:
      PORT: "3002"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The worker's own role: read the run state it executes, own the job
      # queue's schema, and no domain write.
      DATABASE_URL: postgres://porkbot_worker:${PORKBOT_WORKER_DB_PASSWORD:?}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      # Live runs resolve the same encrypted provider credentials the API
      # stores; the worker needs the same keyring, never a provider key itself.
      PORKBOT_CREDENTIAL_KEYS: ${PORKBOT_CREDENTIAL_KEYS:?}
      PORKBOT_CREDENTIAL_ACTIVE_KEY: ${PORKBOT_CREDENTIAL_ACTIVE_KEY:?}
      # Where run-liveness notification links point. Required: a notification
      # whose link goes nowhere is worse than none.
      PORKBOT_WEB_ORIGIN: ${PORKBOT_WEB_ORIGIN:?}
      # The optional webhook destination. Unset, notifications go to the
      # offline emulator; set, the key is read through the generic credential
      # store and both values are required together.
      PORKBOT_NOTIFICATION_WEBHOOK_URL: ${PORKBOT_NOTIFICATION_WEBHOOK_URL:-}
      PORKBOT_NOTIFICATION_WEBHOOK_KEY: ${PORKBOT_NOTIFICATION_WEBHOOK_KEY:-}
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.45"
          memory: 1g

  backup:
    <<: *app
    build:
      context: ..
      target: backup
    image: porkbot/backup:${PORKBOT_IMAGE_TAG:?run `pnpm deploy:setup` (or `pnpm deploy:up`) to render deploy/.env}
    environment:
      PORT: "3004"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The database owner's connection: pg_dump reads the whole schema and the
      # drill creates and drops a scratch database. No other process holds it.
      DATABASE_URL: postgres://${PORKBOT_POSTGRES_USER:-porkbot}:${PORKBOT_POSTGRES_PASSWORD:?}@postgres:5432/${PORKBOT_POSTGRES_DB:-porkbot}
      # The primary storage the homes are read from, read-only: the snapshot
      # archives are every computer's durable home, per COMPUTER_HOME_SYNC.
      PORKBOT_STORAGE_DIR: /var/lib/porkbot/storage
      # The encrypted destination and the sealed key envelope, on separate
      # volumes. The envelope is sealed under a generated passphrase and is what
      # an operator copies off the host; the backup destination is not.
      PORKBOT_BACKUP_DIR: /var/lib/porkbot/backups
      PORKBOT_BACKUP_ENVELOPE_DIR: /var/lib/porkbot/backup-envelope
      PORKBOT_BACKUP_KEYS: ${PORKBOT_BACKUP_KEYS:?}
      PORKBOT_BACKUP_ACTIVE_KEY: ${PORKBOT_BACKUP_ACTIVE_KEY:?}
      PORKBOT_BACKUP_ENVELOPE_PASSPHRASE: ${PORKBOT_BACKUP_ENVELOPE_PASSPHRASE:?}
      # The nightly schedule, the retention window and the drill interval; the
      # defaults are the documented policy and the env file can override them.
      PORKBOT_BACKUP_SCHEDULE_HOUR_UTC: ${PORKBOT_BACKUP_SCHEDULE_HOUR_UTC:-3}
      PORKBOT_BACKUP_SCHEDULE_MINUTE_UTC: ${PORKBOT_BACKUP_SCHEDULE_MINUTE_UTC:-0}
      PORKBOT_BACKUP_RETENTION_DAYS: ${PORKBOT_BACKUP_RETENTION_DAYS:-30}
      PORKBOT_BACKUP_DRILL_INTERVAL_DAYS: ${PORKBOT_BACKUP_DRILL_INTERVAL_DAYS:-30}
      # The off-site target (slice 7.7's S3-compatible adapter). All five or
      # none: empty keeps the local volume, which a self-hosted deployment that
      # syncs the host itself may prefer.
      PORKBOT_BACKUP_S3_ENDPOINT: ${PORKBOT_BACKUP_S3_ENDPOINT:-}
      PORKBOT_BACKUP_S3_BUCKET: ${PORKBOT_BACKUP_S3_BUCKET:-}
      PORKBOT_BACKUP_S3_REGION: ${PORKBOT_BACKUP_S3_REGION:-us-east-1}
      PORKBOT_BACKUP_S3_ACCESS_KEY_ID: ${PORKBOT_BACKUP_S3_ACCESS_KEY_ID:-}
      PORKBOT_BACKUP_S3_SECRET_ACCESS_KEY: ${PORKBOT_BACKUP_S3_SECRET_ACCESS_KEY:-}
    volumes:
      - storage-data:/var/lib/porkbot/storage:ro
      - backup-data:/var/lib/porkbot/backups
      - backup-envelope:/var/lib/porkbot/backup-envelope
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256m

  web:
    <<: *app
    build:
      context: ..
      target: web
    image: porkbot/web:${PORKBOT_IMAGE_TAG:?run `pnpm deploy:setup` (or `pnpm deploy:up`) to render deploy/.env}
    environment:
      PORT: "3000"
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      # Loopback only, like the API's: the proxy is the public surface.
      - "127.0.0.1:${PORKBOT_WEB_PORT:-3000}:3000"
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 256m

  proxy:
    <<: *app
    # The one origin (slice 12.2). Caddy terminates TLS for
    # PORKBOT_AUTH_ORIGIN automatically, passes requests to the API or the
    # SPA by path, and streams responses without buffering; deploy/Caddyfile
    # is that contract and the only place it is written down.
    image: caddy:2.11.4-alpine@sha256:de23def33b17fb5d1290b0f6c2add1d70780e52341896c00a4c8a2a2fe9d355e
    environment:
      # The site Caddy serves and obtains a certificate for. It is the same
      # public origin sessions, links and the MCP callback are bound to.
      PORKBOT_SITE_ADDRESS: ${PORKBOT_AUTH_ORIGIN:?}
      PORKBOT_API_UPSTREAM: http://api:3001
      PORKBOT_WEB_UPSTREAM: http://web:3000
    ports:
      # The public surface. PORKBOT_BIND_ADDRESS must name the interface the
      # host is reachable on (0.0.0.0, or the host's public address);
      # automatic HTTPS cannot answer a challenge it never receives.
      - "${PORKBOT_BIND_ADDRESS:-127.0.0.1}:80:80"
      - "${PORKBOT_BIND_ADDRESS:-127.0.0.1}:443:443"
      - "${PORKBOT_BIND_ADDRESS:-127.0.0.1}:443:443/udp"
    volumes:
      # The shipped config, read-only, plus Caddy's own state: the
      # certificates (so a restart does not re-issue them) and its runtime
      # config. `deploy:down --volumes` deletes them; they are re-issued.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    # Replaces the anchor's process probe with the proxy's own: a loopback
    # listener that answers only when the config loaded and the API route in
    # it works, so a broken proxy-to-API path shows up as an unhealthy
    # service in `pnpm deploy:status`.
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "http://127.0.0.1:8899/healthz"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    deploy:
      resources:
        limits:
          # Caddy is small: it owns TLS and request routing, not work. The
          # freed 0.15 vCPU (the one-shot migrate went to 0.1) keeps the
          # stack's ceilings plus one bot inside the documented floor.
          cpus: "0.1"
          memory: 128m

  supervisor:
    <<: *app
    build:
      context: ..
      target: supervisor
    image: porkbot/supervisor:${PORKBOT_IMAGE_TAG:?run `pnpm deploy:setup` (or `pnpm deploy:up`) to render deploy/.env}
    environment:
      PORT: "3003"
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # The process credential the API presents to the internal computer
      # surface. Both sides read it from the environment.
      PORKBOT_SUPERVISOR_TOKEN: ${PORKBOT_SUPERVISOR_TOKEN:?}
      # The key screen capabilities are signed with. v1.0 ships no screen
      # surface, so the capability path stays closed; the key is still
      # required here so a later screen slice cannot boot half-configured.
      PORKBOT_SCREEN_TOKEN_SECRET: ${PORKBOT_SCREEN_TOKEN_SECRET:?}
      # Which computer a bot gets. A bot may select any kind this deployment
      # configured; a selection whose kind is not configured is refused
      # fail-closed, and a default without its settings fails at supervisor
      # boot rather than at a bot's first run.
      PORKBOT_COMPUTER_PROVIDER: ${PORKBOT_COMPUTER_PROVIDER:?}
      PORKBOT_COMPUTER_IMAGE: ${PORKBOT_COMPUTER_IMAGE:-}
      PORKBOT_COMPUTER_ENDPOINT: ${PORKBOT_COMPUTER_ENDPOINT:-}
      PORKBOT_COMPUTER_TOKEN: ${PORKBOT_COMPUTER_TOKEN:-}
      PORKBOT_COMPUTER_SOCKET: /var/run/docker.sock
      # The credential proxy (slice 7.8): all three or none. Configured, every
      # Docker computer gets a sidecar on its isolated network; run
      # credentials live on the sidecar's own layer and the sandbox carries
      # only a short-lived capability.
      PORKBOT_COMPUTER_PROXY_IMAGE: ${PORKBOT_COMPUTER_PROXY_IMAGE:-}
      PORKBOT_PROXY_TOKEN_SECRET: ${PORKBOT_PROXY_TOKEN_SECRET:-}
      PORKBOT_COMPUTER_EGRESS_NETWORK: ${PORKBOT_COMPUTER_EGRESS_NETWORK:-}
      # Snapshot storage and staging, on the same seam the API writes through.
      PORKBOT_STORAGE_DIR: /var/lib/porkbot/storage
      PORKBOT_COMPUTER_ARCHIVE_DIR: /var/lib/porkbot/computer-archives
      # One bot's share of the host floor (`docs/architecture/computers.md` and
      # `docs/architecture/operations.md`): raise these only after raising the
      # host.
      PORKBOT_COMPUTER_CPUS: ${PORKBOT_COMPUTER_CPUS:-1}
      PORKBOT_COMPUTER_MEMORY_MB: ${PORKBOT_COMPUTER_MEMORY_MB:-2048}
      PORKBOT_COMPUTER_DISK_MB: ${PORKBOT_COMPUTER_DISK_MB:-10240}
      # A machine whose last command is older than this is parked; the home
      # volume survives. Zero disables the idle sweep.
      PORKBOT_COMPUTER_IDLE_MS: ${PORKBOT_COMPUTER_IDLE_MS:-900000}
    volumes:
      # The only place the Docker socket is mounted in the stack. The
      # supervisor owns computer lifecycle; every other process reaches
      # computers through its authenticated surface.
      - ${PORKBOT_DOCKER_SOCKET:-/var/run/docker.sock}:/var/run/docker.sock
      - storage-data:/var/lib/porkbot/storage
      - computer-archives:/var/lib/porkbot/computer-archives
    deploy:
      resources:
        limits:
          cpus: "0.2"
          memory: 384m

volumes:
  postgres-data:
  storage-data:
  computer-archives:
  backup-data:
  backup-envelope:
  # Caddy's certificate store and runtime config. Kept so a restart does not
  # re-issue certificates; `deploy:down --volumes` removes them and Caddy
  # obtains them again on the next boot.
  caddy-data:
  caddy-config:
